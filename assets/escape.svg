<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Stickman escape loop">
<title>Stickman tries to escape</title>
<!-- white underlays + paint-order halos keep #111 shapes visible on #0d1117 dark -->
<rect x="4" y="4" width="792" height="392" rx="18" fill="none" stroke="#fff" stroke-width="11" opacity="0.9"/>
<rect x="4" y="4" width="792" height="392" rx="18" fill="none" stroke="#111" stroke-width="6"/>
<!-- README margin frame -->
<g id="act1">
  <!-- floor -->
  <line x1="40" y1="330" x2="760" y2="330" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <line x1="40" y1="330" x2="760" y2="330" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <!-- banana -->
  <g id="banana" transform="translate(430,318)">
    <path d="M0,0 Q20,12 42,2 Q22,18 0,0 Z" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" opacity="0.9"/>
    <path d="M0,0 Q20,12 42,2 Q22,18 0,0 Z" fill="#FFD23F" stroke="#111" stroke-width="3"/>
  </g>
  <!-- walker: simple stickman, walks 0-3s then slips, hidden after ~4.5s -->
  <g id="walker">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.19;1" begin="0s" dur="24s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" from="60 0" to="420 0" begin="0s" dur="3s" fill="freeze" repeatCount="indefinite" />
    <!-- body parts offset so slip rotation looks right; keep simple -->
    <g id="stickbody" transform="translate(0,230)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#fff" stroke-width="10" opacity="0.9"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#111" stroke-width="6"/>
      <line x1="0" y1="16" x2="0" y2="70" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity="0.9"/>
      <line x1="0" y1="16" x2="0" y2="70" stroke="#111" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="34" x2="-20" y2="58" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.9">
        <animate attributeName="x2" values="-20;20;-20" begin="0s" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="34" x2="-20" y2="58" stroke="#111" stroke-width="5" stroke-linecap="round">
        <animate attributeName="x2" values="-20;20;-20" begin="0s" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="34" x2="20" y2="58" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.9">
        <animate attributeName="x2" values="20;-20;20" begin="0s" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="34" x2="20" y2="58" stroke="#111" stroke-width="5" stroke-linecap="round">
        <animate attributeName="x2" values="20;-20;20" begin="0s" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="70" x2="-18" y2="100" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.9">
        <animate attributeName="x2" values="-18;18;-18" begin="0s" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="70" x2="-18" y2="100" stroke="#111" stroke-width="5" stroke-linecap="round">
        <animate attributeName="x2" values="-18;18;-18" begin="0s" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="70" x2="18" y2="100" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.9">
        <animate attributeName="x2" values="18;-18;18" begin="0s" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="70" x2="18" y2="100" stroke="#111" stroke-width="5" stroke-linecap="round">
        <animate attributeName="x2" values="18;-18;18" begin="0s" dur="1s" repeatCount="indefinite"/>
      </line>
      <animateTransform attributeName="transform" type="rotate" values="0;0;-70;0" keyTimes="0;0.75;0.85;1" begin="0s" dur="4s" fill="freeze" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>
</g>
<g id="act2" opacity="0">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.16;0.33;0.37" begin="0s" dur="24s" repeatCount="indefinite"/>
  <!-- eyes widen at 4s -->
  <g id="eyes-wide" transform="translate(470,240)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.16;0.29;0.33" begin="0s" dur="24s" repeatCount="indefinite"/>
    <circle cx="-8" cy="0" r="3" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke"><animate attributeName="r" values="3;7;7;3" keyTimes="0;0.1;0.8;1" begin="4s" dur="4s" fill="freeze" repeatCount="indefinite"/></circle>
    <circle cx="8" cy="0" r="3" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke"><animate attributeName="r" values="3;7;7;3" keyTimes="0;0.1;0.8;1" begin="4s" dur="4s" fill="freeze" repeatCount="indefinite"/></circle>
    <text x="0" y="-24" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">!</text>
  </g>
  <!-- knock ripples at 6s and 6.6s (one-shots: freeze hidden, no strobe) -->
  <circle cx="620" cy="180" r="6" fill="none" stroke="#fff" stroke-width="8" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="6s" dur="0.8s" repeatCount="1" fill="freeze"/>
    <animate attributeName="r" values="6;34" begin="6s" dur="0.8s" repeatCount="1" fill="freeze"/>
  </circle>
  <circle id="knock-ripple-1" cx="620" cy="180" r="6" fill="none" stroke="#111" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="6s" dur="0.8s" repeatCount="1" fill="freeze"/>
    <animate attributeName="r" values="6;34" begin="6s" dur="0.8s" repeatCount="1" fill="freeze"/>
  </circle>
  <circle cx="620" cy="180" r="6" fill="none" stroke="#fff" stroke-width="8" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="6.6s" dur="0.8s" repeatCount="1" fill="freeze"/>
    <animate attributeName="r" values="6;34" begin="6.6s" dur="0.8s" repeatCount="1" fill="freeze"/>
  </circle>
  <circle id="knock-ripple-2" cx="620" cy="180" r="6" fill="none" stroke="#111" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="6.6s" dur="0.8s" repeatCount="1" fill="freeze"/>
    <animate attributeName="r" values="6;34" begin="6.6s" dur="0.8s" repeatCount="1" fill="freeze"/>
  </circle>
  <text x="620" y="120" text-anchor="middle" font-size="26" font-family="sans-serif" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" opacity="0">BONK!
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" begin="6s" dur="2s" repeatCount="1" fill="freeze"/>
  </text>
</g>
<g id="act3">
  <g id="mallet" transform="translate(560,250)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.33;0.54;0.58" begin="0s" dur="24s" repeatCount="indefinite"/>
    <rect x="-14" y="-70" width="28" height="52" rx="6" fill="none" stroke="#fff" stroke-width="9" opacity="0.9"/>
    <rect x="-14" y="-70" width="28" height="52" rx="6" fill="#E63946" stroke="#111" stroke-width="4"/>
    <rect x="-6" y="-18" width="12" height="58" fill="none" stroke="#fff" stroke-width="9" opacity="0.9"/>
    <rect x="-6" y="-18" width="12" height="58" fill="#8B5E34" stroke="#111" stroke-width="4"/>
    <animateTransform attributeName="transform" type="rotate" values="-30;45;-30" keyTimes="0;0.5;1" begin="8s" dur="2s" fill="freeze" repeatCount="indefinite" additive="replace"/>
  </g>
  <polyline points="600,330 580,260 610,210 590,150 620,100" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.6;0.65" begin="0s" dur="24s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" from="400" to="0" begin="10s" dur="0.6s" fill="freeze" repeatCount="1"/>
  </polyline>
  <polyline id="crack" points="600,330 580,260 610,210 590,150 620,100" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.6;0.65" begin="0s" dur="24s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" from="400" to="0" begin="10s" dur="0.6s" fill="freeze" repeatCount="1"/>
  </polyline>
  <text x="400" y="60" text-anchor="middle" font-size="34" font-family="sans-serif" font-weight="bold" fill="#E63946" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round" opacity="0">CRACK!
    <animate attributeName="opacity" values="0;1;0" begin="10s" dur="1.2s" repeatCount="1" fill="freeze"/>
  </text>
</g>
<g id="act4">
  <g id="leak" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.58;0.71;0.75" begin="0s" dur="24s" repeatCount="indefinite"/>
    <rect x="200" y="20" width="14" height="22" rx="7" fill="none" stroke="#fff" stroke-width="7" opacity="0">
      <animate attributeName="y" values="20;300" begin="14s" dur="1s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" begin="14s" dur="1s" repeatCount="1" fill="freeze"/>
    </rect>
    <rect id="leak-drop" x="200" y="20" width="14" height="22" rx="7" fill="#4CC9F0" stroke="#111" stroke-width="3">
      <animate attributeName="y" values="20;300" begin="14s" dur="1s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" begin="14s" dur="1s" repeatCount="1" fill="freeze"/>
    </rect>
    <rect x="260" y="20" width="10" height="16" rx="5" fill="none" stroke="#fff" stroke-width="7" opacity="0">
      <animate attributeName="y" values="20;300" begin="15s" dur="1s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" begin="15s" dur="1s" repeatCount="1" fill="freeze"/>
    </rect>
    <rect id="leak-drop-2" x="260" y="20" width="10" height="16" rx="5" fill="#4CC9F0" stroke="#111" stroke-width="3">
      <animate attributeName="y" values="20;300" begin="15s" dur="1s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" begin="15s" dur="1s" repeatCount="1" fill="freeze"/>
    </rect>
  </g>
  <g id="big-red-button" transform="translate(680,300)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.67;0.79;0.83" begin="0s" dur="24s" repeatCount="indefinite"/>
    <rect x="-52" y="-18" width="104" height="36" rx="8" fill="none" stroke="#fff" stroke-width="9" opacity="0.9"/>
    <rect x="-52" y="-18" width="104" height="36" rx="8" fill="#fff" stroke="#111" stroke-width="4"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fff" stroke-width="9" opacity="0.9">
      <animate attributeName="r" values="12;9;12" begin="17s" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="12" fill="#E63946" stroke="#111" stroke-width="4">
      <animate attributeName="r" values="12;9;12" begin="17s" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-26" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">DO NOT PRESS</text>
  </g>
</g>
<g id="act5">
  <g id="spinner" transform="translate(400,200)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.79;0.96;1" begin="0s" dur="24s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" begin="19s" dur="1.6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#fff" stroke-width="13" stroke-dasharray="40 30" stroke-linecap="round" opacity="0.9"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#111" stroke-width="8" stroke-dasharray="40 30" stroke-linecap="round"/>
    </g>
    <text x="0" y="70" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">loading…</text>
  </g>
  <rect x="0" y="0" width="800" height="400" fill="#111" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.94;0.97;1" begin="0s" dur="24s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
